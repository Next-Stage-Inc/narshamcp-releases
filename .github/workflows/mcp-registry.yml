name: MCP Registry

# Lists this server on the official MCP Registry (registry.modelcontextprotocol.io).
# It runs only when someone with write access starts it from the Actions tab.
# It uses no third-party actions and reads only this repository and public URLs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "validate = checks only; publish = list server.json; deprecate / activate = change the status of the server.json version"
        type: choice
        options: [validate, publish, deprecate, activate]
        default: validate

permissions: {}

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # read server.json, README.md and the latest release of this repository
      id-token: write # the registry verifies this repository's owner through GitHub OIDC
    env:
      ACTION: ${{ inputs.action }}
      GH_TOKEN: ${{ github.token }}
      PUBLISHER_VERSION: "1.8.1"
      # sha256 of mcp-publisher_linux_amd64.tar.gz in registry_1.8.1_checksums.txt
      PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
      REGISTRY: https://registry.modelcontextprotocol.io
    steps:
      - name: Read server.json and README.md at this commit
        run: |
          set -euo pipefail
          for f in server.json README.md; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=${GITHUB_SHA}" \
              -H "Accept: application/vnd.github.raw" > "$f"
          done
          jq . server.json

      - name: Check server.json against the public release
        run: |
          set -euo pipefail
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          if [ "v${version}" != "${latest}" ]; then
            echo "::error::server.json version ${version} is not the latest release ${latest}"
            exit 1
          fi
          if [ "$(jq '(.packages // []) + (.remotes // []) | length' server.json)" != 0 ]; then
            echo "::error::server.json lists packages or remotes; this listing carries neither"
            exit 1
          fi
          for url in $(jq -r '.websiteUrl, .repository.url' server.json); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            echo "${url} -> ${code}"
            if [ "$code" != 200 ]; then
              echo "::error::${url} answered ${code}"
              exit 1
            fi
          done
          if ! grep -qF "<!-- mcp-name: ${name} -->" README.md; then
            echo "::error::README.md has no mcp-name marker for ${name}"
            exit 1
          fi

      - name: Install mcp-publisher ${{ env.PUBLISHER_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate
        run: ./mcp-publisher validate server.json

      - name: Log in with GitHub OIDC
        if: env.ACTION != 'validate'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: env.ACTION == 'publish'
        run: ./mcp-publisher publish server.json

      - name: Change status
        if: env.ACTION == 'deprecate' || env.ACTION == 'activate'
        run: |
          set -euo pipefail
          status=$([ "$ACTION" = deprecate ] && echo deprecated || echo active)
          ./mcp-publisher status --status "$status" "$(jq -r .name server.json)" "$(jq -r .version server.json)"

      - name: Compare the registry entry with server.json
        if: env.ACTION != 'validate'
        run: |
          set -euo pipefail
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          want=$([ "$ACTION" = deprecate ] && echo deprecated || echo active)
          curl -sSf "${REGISTRY}/v0/servers/$(jq -rn --arg n "$name" '$n|@uri')/versions/${version}" > entry.json
          jq . entry.json
          fields='{name, description, version, websiteUrl, repository}'
          if [ "$(jq -S ".server | ${fields}" entry.json)" != "$(jq -S "${fields}" server.json)" ]; then
            echo "::error::the registry entry differs from server.json"
            exit 1
          fi
          status=$(jq -r '._meta["io.modelcontextprotocol.registry/official"].status' entry.json)
          if [ "$status" != "$want" ]; then
            echo "::error::registry status is ${status}, expected ${want}"
            exit 1
          fi
          echo "registry entry matches server.json; status ${status}"
